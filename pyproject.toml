[project]
name = "zetta-lab-second-challenge"
version = "0.1.0"
description = "Bee: Your To do API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic==2.11.4",
    "python-dotenv==1.2.1",
    "requests>=2.32.5",
]

[project.optional-dependencies]

api = [
    "fastapi==0.115.12",
    "passlib==1.7.4",
    "psycopg2-binary==2.9.10",
    "python-jose==3.5.0",
    "python-multipart==0.0.22",
    "sqlalchemy==2.0.40",
    "uvicorn[standard]==0.34.0",
]

worker = [
    "celery==5.2.7",
    "redis==5.2.1",
]

[dependency-groups]

dev = [
    "httpx==0.27.2",
    "pre-commit>=4.5.1",
    "pytest>=8.2.0,<9.0.0",
    "pytest-asyncio==0.24.0",
    "pytest-cov==7.0.0",
    "ruff>=0.15.0",
]

[tool.ruff]
src = ["codebase"]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "E501"]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]

[tool.ruff.format]
quote-style = "double"
